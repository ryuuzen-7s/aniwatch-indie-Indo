<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — AniWatch API</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🔓 Login AniWatch</h1>
    <div class="nav">
      <a href="index.html">🏠 Beranda</a>
      <a href="login.html" class="active">🔓 Login</a>
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="license.html">📄 Lisensi</a>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="login">🔓 Login</button>
    <button class="tab" data-tab="register">📝 Daftar</button>
  </div>

  <!-- LOGIN -->
  <div class="tab-content active" id="tab-login">
    <div class="panel">
      <h2>🔓 Login</h2>
      <div class="alert" id="login-alert"></div>
      <form id="form-login">
        <div class="form-group">
          <label>Username <span class="required">*</span></label>
          <input type="text" id="login-username" placeholder="username" required minlength="3">
        </div>
        <div class="form-group">
          <label>Password <span class="required">*</span></label>
          <input type="password" id="login-password" placeholder="••••••••" required minlength="6">
        </div>
        <button type="submit" class="block">🔓 Login</button>
      </form>
    </div>
  </div>

  <!-- REGISTER -->
  <div class="tab-content" id="tab-register">
    <div class="panel">
      <h2>📝 Daftar Akun Baru</h2>
      <div class="alert" id="reg-alert"></div>
      <form id="form-register">
        <div class="form-group">
          <label>Username <span class="required">*</span></label>
          <input type="text" id="reg-username" placeholder="min. 3 karakter" required minlength="3">
          <div class="hint">Huruf, angka, _ dan -</div>
        </div>
        <div class="form-group">
          <label>Password <span class="required">*</span></label>
          <input type="password" id="reg-password" placeholder="min. 6 karakter" required minlength="6">
        </div>
        <div class="form-group">
          <label>Email (opsional)</label>
          <input type="email" id="reg-email" placeholder="email@contoh.com">
        </div>
        <button type="submit" class="block">📝 Daftar</button>
      </form>
    </div>
  </div>
</div>

<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
<script>
  if (location.hash === "#register") {
    document.querySelector('.tab[data-tab="register"]').click();
  }
  if (localStorage.getItem("aniwatch_user")) {
    window.location.href = "/portal/dashboard.html";
  }
</script>
</body>
</html>
