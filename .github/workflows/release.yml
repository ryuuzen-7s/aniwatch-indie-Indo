name: Auto Release & Changelog

on:
  push:
    tags:
      - 'v*' # Hanya berjalan jika push tag berawalan 'v' (contoh: v1.2.0)

permissions:
  contents: write # Diperlukan agar bot bisa membuat Release

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Changelog Body
        id: changelog
        run: |
          # Mengambil isi CHANGELOG.md, membuang baris kosong di awal/akhir
          # Kamu bisa memodifikasi ini jika ingin memotong teks tertentu
          CHANGELOG=$(cat MD/CHANGELOG.md)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }} # Menggunakan nama tag (v1.2.0)
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}